name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
  lint:
    # make lint: every file gofmt-formatted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "run make fmt" && exit 1)
  govulncheck:
    # Checks the toolchain setup-go installs (the go.mod toolchain line), which
    # is the one the release workflow builds with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Register qemu binfmt handlers so the emulated-platform e2e test runs
      # (without them it skips).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - run: VULNSUITE_E2E=1 go test -count=1 -v ./internal/e2e/
  templates:
    name: validate vulnsuite-templates with this build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check out vulnsuite-templates (if reachable)
        id: tmpl
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ruzfi/vulnsuite-templates
          path: vulnsuite-templates
          # Prefer the read-only PAT (required while the templates repo is
          # private); fall back to the job token once it is public. The default
          # job token cannot read a *separate private* repo, and fork PRs never
          # receive secrets -- in those cases this step is tolerated and the
          # validation below is skipped, so CI does not hard-fail.
          token: ${{ secrets.TEMPLATES_RO || github.token }}
      - name: Validate vulnsuite-templates with this build
        if: steps.tmpl.outcome == 'success'
        run: go run ./cmd/vulnsuite -templates ./vulnsuite-templates validate -allow-unpinned
      - name: Note skip
        if: steps.tmpl.outcome != 'success'
        run: echo "::notice::Skipped cross-repo template validation -- no access to ruzfi/vulnsuite-templates here (private repo without TEMPLATES_RO, a fork PR, or the repo is unreachable)."
  lint-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
