name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: VULNSUITE_E2E=1 go test -count=1 -v ./internal/e2e/
  templates:
    name: validate vulnsuite-templates with this build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check out vulnsuite-templates (if reachable)
        id: tmpl
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ruzfi/vulnsuite-templates
          path: vulnsuite-templates
          # Prefer the read-only PAT (required while the templates repo is
          # private); fall back to the job token once it is public. The default
          # job token cannot read a *separate private* repo, and fork PRs never
          # receive secrets -- in those cases this step is tolerated and the
          # validation below is skipped, so CI does not hard-fail.
          token: ${{ secrets.TEMPLATES_RO || github.token }}
      - name: Validate vulnsuite-templates with this build
        if: steps.tmpl.outcome == 'success'
        run: go run ./cmd/vulnsuite -templates ./vulnsuite-templates validate -allow-unpinned
      - name: Note skip
        if: steps.tmpl.outcome != 'success'
        run: echo "::notice::Skipped cross-repo template validation -- no access to ruzfi/vulnsuite-templates here (private repo without TEMPLATES_RO, a fork PR, or the repo is unreachable)."
  lint-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: webiny/action-conventional-commits@v1.3.0
