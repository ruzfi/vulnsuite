name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: VULNSUITE_E2E=1 go test -count=1 -v ./internal/e2e/
  templates:
    name: validate vulnsuite-templates with this build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v7
        with:
          repository: ruzfi/vulnsuite-templates
          path: vulnsuite-templates
          # Works whether vulnsuite-templates is private or public: use the
          # read-only PAT when the TEMPLATES_RO secret is set (needed while the
          # repo is private), and fall back to the default job token once the
          # repo is public and the secret is removed. No workflow edit needed
          # when visibility flips.
          token: ${{ secrets.TEMPLATES_RO || github.token }}
      - run: go run ./cmd/vulnsuite -templates ./vulnsuite-templates validate -allow-unpinned
  lint-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: webiny/action-conventional-commits@v1.4.2
