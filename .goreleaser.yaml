version: 2
project_name: vulnsuite
builds:
  - main: ./cmd/vulnsuite
    binary: vulnsuite
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/ruzfi/vulnsuite/internal/cli.Version={{.Version}}
      - -X github.com/ruzfi/vulnsuite/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/ruzfi/vulnsuite/internal/cli.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Performance
      regexp: '^perf'
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
      - '^ci'
      - '^Merge '   # drop merge commits (dev -> main PR merges, branch merges)
